[project]
name = "when-to-act"
version = "0.1.0"
description = "A controlled When2Call training composition experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.10.0",
  "transformers==5.4.0",
  "peft==0.18.1",
  "accelerate>=1.12,<2",
  "bitsandbytes==0.49.2",
  "fla-core==0.4.2",
  "matplotlib>=3.10,<4",
  "rapidfuzz>=3.14,<4",
  "scikit-learn>=1.7,<2",
]
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
